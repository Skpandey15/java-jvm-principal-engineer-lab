spring:
  application:
    name: order-service
  datasource:
    # Point at localhost:25432 (Toxiproxy) instead to inject DB latency/failures.
    url: jdbc:postgresql://localhost:15432/lab
    username: lab
    password: lab
    hikari:
      maximum-pool-size: 10
      connection-timeout: 2000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50          # INSERT order lines in batches (needs the pooled sequence, not IDENTITY)
        order_inserts: true
        order_updates: true
  mvc:
    problemdetails:
      enabled: true               # RFC 9457 error bodies, including validation errors
  threads:
    virtual:
      enabled: false   # WP-04: flip to compare platform vs virtual threads

server:
  port: 18080
  shutdown: graceful

# Observability wiring (platform/observability/README.md):
#   metrics -> Prometheus scrapes /actuator/prometheus (same path as Kubernetes; enables exemplars)
#   traces  -> OTLP -> Tempo      logs -> OTLP -> Loki (with trace_id/span_id)
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Real histograms, so p95/p99 are computed from buckets across instances (never average percentiles)
      percentiles-histogram:
        http.server.requests: true
        hikaricp.connections.acquire: true
      # Extra bucket boundaries at the SLO thresholds, so "% of requests under 200 ms" is exact
      slo:
        http.server.requests: 50ms, 100ms, 200ms, 500ms, 1s, 2s
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 10s
  tracing:
    sampling:
      probability: 1.0   # lab setting: trace every request
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:14318/v1/traces
    logging:
      export:
        otlp:
          endpoint: http://localhost:14318/v1/logs
  otlp:
    metrics:
      export:
        enabled: false   # metrics are scraped, not pushed

lab:
  seed:
    enabled: true                 # ~200k orders on first start (db/seed/bulk-seed.sql); off in tests and CI
  payment:
    base-url: http://localhost:18081   # payment-stub; use :28081 to go through Toxiproxy
    connect-timeout: 1s
    read-timeout: 2s
  faults:
    retain-created-orders: false

# SQL statements appear as spans inside each request trace (datasource-micrometer)
jdbc:
  datasource-proxy:
    include-parameter-values: false
