spring:
  application:
    name: payment-stub

server:
  port: 18081

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

lab:
  payment:
    latency-ms: 50
    failure-rate: 0.0
    max-concurrent: 20
