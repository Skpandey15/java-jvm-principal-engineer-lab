# CI/CD pipeline for the lab.
#
#   build ─┬─> image ──> deploy-kind      (every PR and push to main)
#          │      └────> publish          (push to main only: GHCR)
#   validate
#   dependency-review                      (PRs only)
#
# Third-party actions are pinned to full commit SHAs (tags can be moved); Dependabot keeps them current.
name: ci-cd

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # dependency graph submission (enables Dependabot alerts for Gradle dependencies)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # JDK 27 for the comparison toolchain; JDK 25 last so it is the default on PATH
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            27
            25

      # Caches Gradle, validates the wrapper jar, submits the dependency graph on main
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          dependency-graph: ${{ github.event_name == 'push' && 'generate-and-submit' || 'disabled' }}

      # Unit + Testcontainers integration tests (Docker is available on ubuntu runners); also compiles the JMH suite
      - name: Build
        run: ./gradlew build :benchmarks:jmhJar --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

  validate:
    name: Validate platform config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint GitHub workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

      - name: Validate docker compose
        run: docker compose -f platform/docker-compose.yml config --quiet

      - name: Render Kubernetes manifests
        run: |
          kubectl kustomize platform/k8s/base > /dev/null
          kubectl kustomize platform/k8s/overlays/ci > /dev/null

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  image:
    name: Build image, SBOM and scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write   # upload Trivy results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # Layered-jar Dockerfile on Temurin 25 (see platform/docker/spring-boot.Dockerfile for why not buildpacks)
      - name: Build images
        run: |
          ./gradlew --no-daemon :reference-service:order-service:bootJar :reference-service:payment-stub:bootJar
          for svc in order-service payment-stub; do
            docker build -f platform/docker/spring-boot.Dockerfile \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=$IMAGE_TAG" \
              -t "lab/$svc:$IMAGE_TAG" "reference-service/$svc"
          done

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: lab/order-service:${{ env.IMAGE_TAG }}
          format: cyclonedx-json
          artifact-name: order-service-sbom.cdx.json

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lab/order-service:${{ env.IMAGE_TAG }}
          format: sarif
          output: trivy-order-service.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload scan results to code scanning
        if: always() && hashFiles('trivy-order-service.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-order-service.sarif
          category: trivy-order-service

      # Gate: fail the pipeline on fixable CRITICAL vulnerabilities (HIGH is reported above, not blocking)
      - name: Fail on critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lab/order-service:${{ env.IMAGE_TAG }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          skip-setup-trivy: true

      - name: Save images for the deploy and publish jobs
        run: |
          docker save \
            "lab/order-service:$IMAGE_TAG" \
            "lab/payment-stub:$IMAGE_TAG" \
            | gzip > images.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: images.tar.gz
          retention-days: 1

  deploy-kind:
    name: Deploy to kind and smoke test
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images

      # Local registry kind-registry:5000, reachable from the cluster; published on the runner as localhost:5000
      - name: Create kind cluster
        uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: jvm-lab
          config: platform/k8s/kind-config.yaml
          registry: true

      - name: Push image to the cluster registry
        run: |
          gunzip -c images.tar.gz | docker load
          docker tag "lab/order-service:$IMAGE_TAG" localhost:5000/order-service:ci
          docker push localhost:5000/order-service:ci

      - name: Deploy
        run: |
          kubectl apply -k platform/k8s/overlays/ci
          kubectl -n jvm-lab rollout status deployment/postgres --timeout=180s
          kubectl -n jvm-lab rollout status deployment/order-service --timeout=300s

      # NodePort 30080 is mapped to the runner by kind-config.yaml
      - name: Smoke test
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do curl -sf localhost:30080/actuator/health > /dev/null && break; sleep 2; done
          id=$(curl -sf -X POST localhost:30080/orders \
                 -H 'Content-Type: application/json' \
                 -d '{"customerId":1,"lines":[{"productId":1,"quantity":2}]}' | jq -r .id)
          curl -sf "localhost:30080/orders/$id" | jq -e '.status == "CREATED"'
          curl -sf localhost:30080/actuator/health/readiness | jq -e '.status == "UP"'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:30080/orders \
                   -H 'Content-Type: application/json' -d '{"customerId":null,"lines":[]}')
          test "$code" = 400

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n jvm-lab get pods -o wide
          kubectl -n jvm-lab describe pods
          kubectl -n jvm-lab logs deployment/order-service --tail=200 || true
          kubectl -n jvm-lab get events --sort-by=.lastTimestamp

  publish:
    name: Publish images to GHCR
    needs: [image, deploy-kind]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push (commit SHA + main)
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          gunzip -c images.tar.gz | docker load
          registry="ghcr.io/${OWNER,,}/jvm-lab"
          for svc in order-service payment-stub; do
            for tag in "$IMAGE_TAG" main; do
              docker tag "lab/$svc:$IMAGE_TAG" "$registry/$svc:$tag"
              docker push "$registry/$svc:$tag"
            done
          done
