# WP-09 starting point. Build and load the image first:
#   ./gradlew :reference-service:order-service:bootJar
#   docker build -f platform/docker/spring-boot.Dockerfile -t lab/order-service:0.1.0 reference-service/order-service
#   kind load docker-image lab/order-service:0.1.0 --name jvm-lab
#   kubectl apply -k platform/k8s/base
# Uses the lab-only PostgreSQL from postgres.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: lab/order-service:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT     # inside the cluster the service uses the conventional 8080
              value: "8080"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/lab
            # Replaces the Dockerfile default, so repeat every flag you need.
            # Heap is a share of the container limit, leaving room for metaspace, threads and direct memory
            # (60% of 768Mi = 462MiB max heap). Replace with numbers from your memory budget worksheet (WP-09 lab).
            # WP-09 finding to investigate: with a CPU limit below 2, the JVM treats the pod as a client-class
            # machine and silently picks SerialGC instead of G1 (check: jcmd 1 VM.flags | grep GC).
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60 -XX:+ExitOnOutOfMemoryError -XX:NativeMemoryTracking=summary"
          resources:
            requests:
              cpu: "500m"
              memory: "768Mi"
            limits:
              cpu: "1"
              memory: "768Mi"
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
spec:
  type: NodePort
  selector:
    app: order-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
